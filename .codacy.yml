---
# Codacy repository configuration.
#
# Cppcheck (Codacy's C/C++ engine) analyzes each header in isolation and
# parses it as C. src/qcommon/sys_socket.h is a deliberately data-only
# C++ header whose SysSocketAddress members are read and written only by
# the platform backends (src/_platform/posix/sys_socket.cpp and
# src/_platform/win32/sys_socket.cpp), so the header-isolated view reports
# `address` (:36) and `port` (:37) as unused struct members even though
# both are used throughout the backends. That same C parse of the C++
# header also produced spurious MISRA findings on every compliant inline
# comparison shape tried inside it (ki-eudd Codacy rounds), which is why
# the byte-exact equality rule lives in the backends. The header is
# excluded from the Cppcheck engine for exactly that documented reason;
# Cppcheck coverage of every other source file is untouched.
engines:
  cppcheck:
    exclude_paths:
      - "src/qcommon/sys_socket.h"
