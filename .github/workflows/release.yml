# Release workflow for KisakCOD (G6 in docs/ROADMAP.md).
#
# Manual only: Actions > Release > Run workflow. A tag push releases nothing.
#   metadata   validates the version and builds the matrix from
#              docs/capability/manifest.json (scripts/ci/release_meta.py):
#              one leg per required target x role cell at `links` or above,
#              labelled preview, beta or first-class by the cell's level
#   source     the release commit's source archive, without the vendor
#              runtime binaries (Miles, Bink, Steamworks)
#   build      per leg: build, split and check the debug symbols, package
#              (tar.xz on Linux and macOS, zip on Windows), then smoke-run
#              the binary unpacked from the package
#   checksums  SHA256SUMS over every packaged file
#   notes      release notes: packages, tiers, changes since the last release
#   publish    the only job with contents: write and it checks nothing out:
#              verifies the files against SHA256SUMS, then creates or
#              updates the draft release and publishes it unless draft=true
#
# dry_run (the default) builds and packages but never creates a release.
# Publishing needs dry_run=false, a vX.Y.Z version, a dispatch from master,
# a successful ci.yml push run on master for the exact commit, and no tag of
# that version on another commit. The metadata gate fails closed otherwise.
#
# Every other job holds contents: read only; actions are pinned by commit
# SHA; no checkout persists credentials. Retail data never enters a package
# (docs/CHARTER.md). Windows x86 is a baseline, not a release target: ci.yml
# keeps it building. Artifacts live 90 days; a GitHub release is the
# long-term store.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version vX.Y.Z (required to publish; a dry run defaults to v0.0.0-dryrun)
        required: false
        default: ""
        type: string
      draft:
        description: Leave the release as an unpublished draft
        required: false
        default: true
        type: boolean
      dry_run:
        description: Build and package only; never create a release
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ github.sha }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      name: ${{ steps.meta.outputs.name }}
      matrix: ${{ steps.meta.outputs.matrix }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Test the release script
        run: python3 scripts/ci/release_meta_test.py

      - name: Version and build matrix
        id: meta
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: >
          python3 scripts/ci/release_meta.py metadata --version "$VERSION" --dry-run "$DRY_RUN"
          >> "$GITHUB_OUTPUT"

      - name: Gate on master CI and the version's tag
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ci_runs="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f branch=master -f event=push -f status=success --jq .total_count)"
          # The version's tag, peeled to its commit; empty when there is none.
          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${TAG}" \
            --jq ".[] | select(.ref == \"refs/tags/${TAG}\") | .object.type + \" \" + .object.sha")"
          tag_commit="${ref#* }"
          if [ "${ref%% *}" = tag ]; then
            tag_commit="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_commit}" --jq .object.sha)"
          fi
          echo "master CI runs for ${GITHUB_SHA}: ${ci_runs}; tag ${TAG}: ${tag_commit:-none}"
          python3 scripts/ci/release_meta.py gate --commit "$GITHUB_SHA" --ref "$GITHUB_REF" \
            --ci-runs "$ci_runs" --tag-commit "$tag_commit" --dry-run "$DRY_RUN" >> "$GITHUB_OUTPUT"

  source:
    name: Source archive
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMMIT: ${{ needs.metadata.outputs.commit }}
      TAG: ${{ needs.metadata.outputs.tag }}
      STEM: kisakcod-${{ needs.metadata.outputs.version }}-source
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false

      - name: Archive the source without vendor runtime binaries
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT"
          # The Miles, Bink and Steamworks binaries are not ours to
          # redistribute; no release leg needs them.
          excludes=()
          for ext in dll lib exp obj flt asi so dylib orig; do excludes+=(":(exclude,glob)**/*.${ext}"); done
          mkdir -p dist
          git archive --format=tar.gz --prefix="${STEM}/" -o "dist/${STEM}.tar.gz" HEAD -- . "${excludes[@]}"
          listing="$(tar -tzf "dist/${STEM}.tar.gz")"
          for required in CMakeLists.txt LICENSE src scripts docs; do
            grep -qE "^${STEM}/${required}(/|$)" <<<"$listing" \
              || { echo "::error::the source archive misses ${required}" >&2; exit 1; }
          done
          if grep -iE '\.(dll|lib|exp|obj|flt|asi|so|dylib|orig)$' <<<"$listing"; then
            echo "::error::the source archive holds vendor binaries" >&2
            exit 1
          fi
          jq -n --arg tag "$TAG" --arg commit "$COMMIT" --arg run "$GITHUB_RUN_ID" \
            '{tag: $tag, commit: $commit, content: "git archive of the commit without vendor runtime binaries",
              workflow_run: $run}' > "dist/${STEM}-provenance.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.STEM }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  build:
    name: Build / ${{ matrix.label }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    env:
      COMMIT: ${{ needs.metadata.outputs.commit }}
      TAG: ${{ needs.metadata.outputs.tag }}
      VERSION: ${{ needs.metadata.outputs.version }}
      STEM: ${{ matrix.stem }}
      BINARY: ${{ matrix.binary }}
      FILE_ARCH: ${{ matrix.file_arch }}
      LEG: ${{ toJSON(matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          # The engine's build number is the commit count (increment_build.cmake).
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Assert the checked-out commit
        run: test "$(git rev-parse HEAD)" = "$COMMIT"

      - name: Install clang, lld and Ninja
        if: matrix.recipe == 'linux-headless'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang lld ninja-build

      # ci.yml's linux-headless configure, with debug info and a build ID.
      - name: Configure
        if: matrix.recipe == 'linux-headless'
        run: >
          cmake -S . -B build-release -G Ninja
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DKISAK_BUILD_MP=OFF -DKISAK_BUILD_DEDICATED=ON -DKISAK_BUILD_SP=OFF
          -DKISAK_DEDI_HEADLESS=ON -DKISAK_ENABLE_STEAM=OFF
          -DKISAK_ALLOW_UNSUPPORTED_64BIT=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_EXE_LINKER_FLAGS=-Wl,--build-id=sha1

      # ci.yml's windows-headless configure. RelWithDebInfo puts full debug
      # info in the PDB; the link is optimised and not incremental.
      - name: Configure
        if: matrix.recipe == 'windows-headless'
        shell: pwsh
        run: >
          cmake -S . -B build-release -A "$env:FILE_ARCH"
          -DKISAK_BUILD_MP=OFF -DKISAK_BUILD_DEDICATED=ON -DKISAK_BUILD_SP=OFF
          -DKISAK_DEDI_HEADLESS=ON -DKISAK_ENABLE_STEAM=OFF
          -DKISAK_ENABLE_X86_MMX_SKINNING=OFF -DKISAK_ALLOW_UNSUPPORTED_64BIT=ON
          -DBUILD_TESTING=OFF
          "-DCMAKE_EXE_LINKER_FLAGS_RELWITHDEBINFO=/DEBUG /INCREMENTAL:NO /OPT:REF /OPT:ICF"

      # ci.yml's macos-headless configure, with debug info. The DWARF stays in
      # the object files until dsymutil gathers it into the dSYM.
      - name: Configure
        if: matrix.recipe == 'macos-headless'
        run: >
          cmake -S . -B build-release -G Ninja
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DKISAK_BUILD_MP=OFF -DKISAK_BUILD_DEDICATED=ON -DKISAK_BUILD_SP=OFF
          -DKISAK_DEDI_HEADLESS=ON -DKISAK_ENABLE_STEAM=OFF
          -DKISAK_ALLOW_UNSUPPORTED_64BIT=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo

      # --config picks the Visual Studio configuration; Ninja ignores it.
      - name: Build
        run: cmake --build build-release --config RelWithDebInfo --target "$BINARY" --parallel

      - name: Split the debug symbols and check both halves
        if: matrix.recipe == 'linux-headless'
        run: |
          bin="stage/${STEM}/${BINARY}"
          dbg="symbols/${STEM}/${BINARY}.debug"
          mkdir -p "stage/${STEM}" "symbols/${STEM}"
          cp "bin/${BINARY}" "$bin"
          objcopy --only-keep-debug "$bin" "$dbg"
          strip --strip-debug --strip-unneeded "$bin"
          objcopy --add-gnu-debuglink="$dbg" "$bin"
          fail() { echo "::error::$*" >&2; exit 1; }
          build_id() { readelf -n "$1" 2>/dev/null | awk '/Build ID/ {print $3}'; }
          sections="$(readelf -S --wide "$bin")"
          debug_sections="$(readelf -S --wide "$dbg" 2>/dev/null)"
          link="$(readelf -p .gnu_debuglink "$bin")"
          if grep -q '\.debug_' <<<"$sections"; then fail "the stripped binary keeps debug sections"; fi
          grep -q '\.debug_info' <<<"$debug_sections" || fail "the symbol file has no .debug_info"
          grep -qF "${BINARY}.debug" <<<"$link" || fail "the binary has no .gnu_debuglink to ${BINARY}.debug"
          id="$(build_id "$bin")"
          if [ -z "$id" ] || [ "$id" != "$(build_id "$dbg")" ]; then fail "the binary and symbol build IDs differ"; fi
          scripts/ci/verify-artifact-arch.sh "$FILE_ARCH" "$bin"
          echo "BUILD_ID=$id" >> "$GITHUB_ENV"

      - name: Check the debug symbols against the binary
        if: matrix.recipe == 'windows-headless'
        run: |
          mkdir -p "stage/${STEM}" "symbols/${STEM}"
          cp "bin/RelWithDebInfo/${BINARY}.exe" "stage/${STEM}/"
          cp "bin/RelWithDebInfo/${BINARY}.pdb" "symbols/${STEM}/"
          # The exe's CodeView record must name this PDB and carry its GUID and age.
          python scripts/ci/release_meta.py pdb-id --exe "stage/${STEM}/${BINARY}.exe" \
            --pdb "symbols/${STEM}/${BINARY}.pdb" | tr -d '\r' >> "$GITHUB_ENV"
          # The README promises a static C runtime: no VC++ runtime DLL imports.
          if grep -qaiE '(vcruntime|msvcp)[0-9]+(_[0-9]+)?\.dll' "stage/${STEM}/${BINARY}.exe"; then
            echo "::error::the binary imports the Visual C++ runtime DLLs" >&2
            exit 1
          fi

      - name: Split the debug symbols into a dSYM and check both halves
        if: matrix.recipe == 'macos-headless'
        run: |
          bin="stage/${STEM}/${BINARY}"
          dsym="symbols/${STEM}/${BINARY}.dSYM"
          mkdir -p "stage/${STEM}" "symbols/${STEM}"
          cp "bin/${BINARY}" "$bin"
          dsymutil "$bin" -o "$dsym"
          strip -S -x "$bin"
          # Stripping voids the linker's ad-hoc signature, and arm64 macOS
          # kills a binary whose signature does not match; sign it again.
          codesign --force --sign - "$bin"
          codesign --verify --strict "$bin"
          fail() { echo "::error::$*" >&2; exit 1; }
          uuid() { dwarfdump --uuid "$1" | awk -v arch="($FILE_ARCH)" '$3 == arch {print $2}'; }
          # Captured, not piped into grep -q: under pipefail an early grep exit fails the producer.
          symbols="$(nm -ap "$bin")"
          dwarf_sections="$(otool -l "${dsym}/Contents/Resources/DWARF/${BINARY}")"
          # strip leaves one OPT stab (radr://5614542) as its own marker; the debug map must go.
          if grep -qE ' - [0-9a-f]{2} [0-9a-f]{4} +(SO|OSO|FUN) ' <<<"$symbols"; then
            fail "the stripped binary keeps its debug map (SO/OSO/FUN stabs)"
          fi
          grep -q 'sectname __debug_info' <<<"$dwarf_sections" || fail "the dSYM has no __debug_info"
          id="$(uuid "$bin")"
          if [ -z "$id" ] || [ "$id" != "$(uuid "$dsym")" ]; then fail "the binary and dSYM UUIDs differ"; fi
          scripts/ci/verify-artifact-arch.sh "$FILE_ARCH" "$bin"
          echo "BUILD_ID=$id" >> "$GITHUB_ENV"

      - name: Verify binary architecture
        if: matrix.recipe == 'windows-headless'
        shell: pwsh
        run: ./scripts/ci/verify-artifact-arch.ps1 -Expected $env:FILE_ARCH "stage/$env:STEM/$env:BINARY.exe"

      - name: Package
        if: matrix.recipe == 'linux-headless'
        run: |
          symbols="$(objdump -T "stage/${STEM}/${BINARY}")"
          glibc="$(grep -o 'GLIBC_[0-9.]*' <<<"$symbols" | sort -uV | tail -n 1)"
          glibcxx="$(grep -o 'GLIBCXX_[0-9.]*' <<<"$symbols" | sort -uV | tail -n 1)"
          requires="64-bit Linux with glibc ${glibc#GLIBC_} and libstdc++ ${glibcxx} or newer"
          cp LICENSE "stage/${STEM}/LICENSE"
          python3 scripts/ci/release_meta.py readme --leg "$LEG" --version "$VERSION" --commit "$COMMIT" \
            --requires "$requires" > "stage/${STEM}/README.txt"
          epoch="$(git log -1 --format=%ct)"
          tarxz() {
            tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@${epoch}" -C "$1" -cJf "$2" "$STEM"
          }
          mkdir -p dist
          tarxz stage "dist/${STEM}.tar.xz"
          tarxz symbols "dist/${STEM}-debugsymbols.tar.xz"
          jq -n --arg tag "$TAG" --arg commit "$COMMIT" --argjson leg "$LEG" --arg build_id "$BUILD_ID" \
            --arg compiler "$(clang --version | sed -n 1p)" --arg cmake "$(cmake --version | sed -n 1p)" \
            --arg tracy "$(git -C build-release/_deps/tracy-src rev-parse HEAD)" \
            --arg image "${ImageOS:-}-${ImageVersion:-}" --arg requires "$requires" --arg run "$GITHUB_RUN_ID" \
            '{tag: $tag, commit: $commit, target: $leg.target, role: $leg.role, level: $leg.level,
              tier: $leg.tier, config: "RelWithDebInfo", build_id: $build_id, compiler: $compiler,
              cmake: $cmake, tracy: $tracy, runner_image: $image, requires: $requires,
              workflow_run: $run}' > "dist/${STEM}-provenance.json"

      - name: Smoke-run the packaged binary
        if: matrix.recipe == 'linux-headless'
        run: |
          diff <(tar -tJf "dist/${STEM}.tar.xz") \
            <(printf '%s\n' "${STEM}/" "${STEM}/${BINARY}" "${STEM}/LICENSE" "${STEM}/README.txt")
          diff <(tar -tJf "dist/${STEM}-debugsymbols.tar.xz") <(printf '%s\n' "${STEM}/" "${STEM}/${BINARY}.debug")
          unpacked="${RUNNER_TEMP}/unpacked"
          mkdir -p "$unpacked"
          tar -xJf "dist/${STEM}.tar.xz" -C "$unpacked"
          python3 scripts/ci/headless_smoke.py "${unpacked}/${STEM}/${BINARY}"

      - name: Package
        if: matrix.recipe == 'windows-headless'
        run: |
          requires="64-bit Windows on ${FILE_ARCH}; the C runtime is linked in, so no Visual C++ redistributable is needed"
          cp LICENSE "stage/${STEM}/LICENSE"
          python scripts/ci/release_meta.py readme --leg "$LEG" --version "$VERSION" --commit "$COMMIT" \
            --requires "$requires" > "stage/${STEM}/README.txt"
          epoch="$(git log -1 --format=%ct)"
          mkdir -p dist
          pack() { python scripts/ci/release_meta.py zip --root "$1" --stem "$STEM" --epoch "$epoch" --out "$2"; }
          pack stage "dist/${STEM}.zip"
          pack symbols "dist/${STEM}-debugsymbols.zip"
          compiler="$(sed -n 's/^set(CMAKE_CXX_COMPILER_VERSION "\(.*\)")$/MSVC \1/p' \
            build-release/CMakeFiles/*/CMakeCXXCompiler.cmake)"
          jq -n --arg tag "$TAG" --arg commit "$COMMIT" --argjson leg "$LEG" --arg build_id "$BUILD_ID" \
            --arg compiler "$compiler" --arg cmake "$(cmake --version | sed -n 1p)" \
            --arg tracy "$(git -C build-release/_deps/tracy-src rev-parse HEAD)" \
            --arg image "${ImageOS:-}-${ImageVersion:-}" --arg requires "$requires" --arg run "$GITHUB_RUN_ID" \
            '{tag: $tag, commit: $commit, target: $leg.target, role: $leg.role, level: $leg.level,
              tier: $leg.tier, config: "RelWithDebInfo", build_id: $build_id, compiler: $compiler,
              cmake: $cmake, tracy: $tracy, runner_image: $image, requires: $requires,
              workflow_run: $run}' > "dist/${STEM}-provenance.json"

      - name: Smoke-run the packaged binary
        if: matrix.recipe == 'windows-headless'
        run: |
          names() {
            python -c 'import sys, zipfile; print(*zipfile.ZipFile(sys.argv[1]).namelist(), sep="\n")' "$1" | tr -d '\r'
          }
          diff <(names "dist/${STEM}.zip") \
            <(printf '%s\n' "${STEM}/${BINARY}.exe" "${STEM}/LICENSE" "${STEM}/README.txt")
          diff <(names "dist/${STEM}-debugsymbols.zip") <(printf '%s\n' "${STEM}/${BINARY}.pdb")
          python -m zipfile -e "dist/${STEM}.zip" unpacked
          python scripts/ci/headless_smoke.py "unpacked/${STEM}/${BINARY}.exe"

      - name: Package
        if: matrix.recipe == 'macos-headless'
        run: |
          # awk reads to the end: an early exit would fail otool under pipefail.
          minos="$(otool -l "stage/${STEM}/${BINARY}" \
            | awk '/LC_BUILD_VERSION/ {b = 1} b && $1 == "minos" && !found {print $2; found = 1}')"
          requires="macOS ${minos} or newer on Apple silicon. The binary is ad-hoc signed, not notarized:"
          requires+=" run xattr -d com.apple.quarantine on a downloaded copy"
          cp LICENSE "stage/${STEM}/LICENSE"
          python3 scripts/ci/release_meta.py readme --leg "$LEG" --version "$VERSION" --commit "$COMMIT" \
            --requires "$requires" > "stage/${STEM}/README.txt"
          epoch="$(git log -1 --format=%ct)"
          mkdir -p dist
          # The image has GNU tar but no xz for it to call.
          pack() { python3 scripts/ci/release_meta.py tarxz --root "$1" --stem "$STEM" --epoch "$epoch" --out "$2"; }
          pack stage "dist/${STEM}.tar.xz"
          pack symbols "dist/${STEM}-debugsymbols.tar.xz"
          jq -n --arg tag "$TAG" --arg commit "$COMMIT" --argjson leg "$LEG" --arg build_id "$BUILD_ID" \
            --arg compiler "$(clang --version | sed -n 1p)" --arg cmake "$(cmake --version | sed -n 1p)" \
            --arg sdk "macOS SDK $(xcrun --show-sdk-version)" \
            --arg tracy "$(git -C build-release/_deps/tracy-src rev-parse HEAD)" \
            --arg image "${ImageOS:-}-${ImageVersion:-}" --arg requires "$requires" --arg run "$GITHUB_RUN_ID" \
            '{tag: $tag, commit: $commit, target: $leg.target, role: $leg.role, level: $leg.level,
              tier: $leg.tier, config: "RelWithDebInfo", build_id: $build_id, compiler: $compiler,
              sdk: $sdk, cmake: $cmake, tracy: $tracy, runner_image: $image, requires: $requires,
              workflow_run: $run}' > "dist/${STEM}-provenance.json"

      - name: Smoke-run the packaged binary
        if: matrix.recipe == 'macos-headless'
        run: |
          diff <(tar -tJf "dist/${STEM}.tar.xz") \
            <(printf '%s\n' "${STEM}/" "${STEM}/${BINARY}" "${STEM}/LICENSE" "${STEM}/README.txt")
          listing="$(tar -tJf "dist/${STEM}-debugsymbols.tar.xz")"
          grep -qx "${STEM}/${BINARY}.dSYM/Contents/Resources/DWARF/${BINARY}" <<<"$listing" \
            || { echo "::error::the symbols package has no dSYM DWARF file" >&2; exit 1; }
          unpacked="$(cd "$RUNNER_TEMP" && pwd -P)/unpacked"
          mkdir -p "$unpacked"
          tar -xJf "dist/${STEM}.tar.xz" -C "$unpacked"
          codesign --verify --strict "${unpacked}/${STEM}/${BINARY}"
          # As in ci.yml's macos-headless: a symlink-free TMPDIR for the smoke's roots.
          TMPDIR="$(cd "$RUNNER_TEMP" && pwd -P)" python3 scripts/ci/headless_smoke.py "${unpacked}/${STEM}/${BINARY}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.stem }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  checksums:
    name: SHA256SUMS
    needs: [metadata, source, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: kisakcod-${{ needs.metadata.outputs.version }}-*
          path: artifacts

      - name: Checksum every packaged file
        run: |
          scripts/ci/aggregate-checksums.sh artifacts SHA256SUMS.txt
          { echo "### kisakcod ${VERSION}"; echo '```'; cat SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kisakcod-${{ needs.metadata.outputs.version }}-SHA256SUMS
          path: SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

  notes:
    name: Release notes
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          # History and tags, for the changes since the previous release.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Generate the release notes
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          COMMIT: ${{ needs.metadata.outputs.commit }}
          MATRIX: ${{ needs.metadata.outputs.matrix }}
        run: |
          python3 scripts/ci/release_meta.py notes --tag "$TAG" --commit "$COMMIT" --matrix "$MATRIX" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish release
    needs: [metadata, checksums, notes]
    if: needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.metadata.outputs.tag }}
      NAME: ${{ needs.metadata.outputs.name }}
      COMMIT: ${{ needs.metadata.outputs.commit }}
      PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
      DRAFT: ${{ inputs.draft }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: kisakcod-${{ needs.metadata.outputs.version }}-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
          path: notes

      - name: Verify every file against SHA256SUMS
        run: |
          cd dist
          sha256sum --check --strict SHA256SUMS.txt
          diff <(find . -type f ! -name SHA256SUMS.txt -printf '%P\n' | sort) <(awk '{print $2}' SHA256SUMS.txt | sort)
          shopt -s nullglob
          for archive in *.tar.xz; do tar -tJf "$archive" > /dev/null; done
          for archive in *.zip; do unzip -tqq "$archive"; done
          tar -tzf ./*-source.tar.gz > /dev/null

      - name: Create or update the draft, then publish unless draft
        run: |
          fail() { echo "::error::$*" >&2; exit 1; }
          # The tag must still be absent or on the release commit.
          ref="$(gh api "repos/${GH_REPO}/git/matching-refs/tags/${TAG}" \
            --jq ".[] | select(.ref == \"refs/tags/${TAG}\") | .object.type + \" \" + .object.sha")"
          tag_commit="${ref#* }"
          if [ "${ref%% *}" = tag ]; then
            tag_commit="$(gh api "repos/${GH_REPO}/git/tags/${tag_commit}" --jq .object.sha)"
          fi
          if [ -n "$tag_commit" ] && [ "$tag_commit" != "$COMMIT" ]; then fail "tag ${TAG} is on ${tag_commit}"; fi
          # A published release is never rewritten; one draft is updated in place.
          existing="$(gh api --paginate "repos/${GH_REPO}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${TAG}\") | .draft")"
          notes=(--title "$NAME" --notes-file notes/release-notes.md --prerelease="$PRERELEASE")
          case "$existing" in
            "")
              gh release create "$TAG" dist/* --draft --target "$COMMIT" "${notes[@]}" ;;
            true)
              gh release edit "$TAG" --target "$COMMIT" "${notes[@]}"
              for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
                [ -f "dist/${asset}" ] || gh release delete-asset "$TAG" "$asset" --yes
              done
              gh release upload "$TAG" dist/* --clobber ;;
            *)
              fail "release ${TAG} is already published, or has more than one draft" ;;
          esac
          if [ "$DRAFT" = false ]; then
            gh release edit "$TAG" --draft=false
            tag_commit="$(gh api "repos/${GH_REPO}/commits/${TAG}" --jq .sha)"
            [ "$tag_commit" = "$COMMIT" ] || fail "published tag ${TAG} is on ${tag_commit}, not ${COMMIT}"
          fi
          gh release view "$TAG" --json url,isDraft,isPrerelease,assets \
            --jq '"\(.url) draft=\(.isDraft) prerelease=\(.isPrerelease) assets=\(.assets | length)"'
