# CI gate for KisakCOD (docs/ROADMAP.md, WS-7).
#
#   - every job has a bounded timeout; superseded PR runs cancel
#   - every action is pinned to an immutable commit SHA (tag in comment)
#   - no checkout keeps persisted credentials; contents: read is the only
#     workflow permission
#   - scaffolding-complete aggregates the gating jobs; native64-census is
#     informational (KPIs K1-K3, K5) and never gates
#   - the Windows x86 byte-parity and no-Steam builds run nightly
#     (nightly.yml), not per push
#
# The engine targets are Win32-x86-only until gate G1: CMakeLists.txt fails
# a non-win32 or 64-bit engine configure unless KISAK_ALLOW_UNSUPPORTED_64BIT
# is set. The portable legs build and run the test suite only.
#
# CI artifacts live 14 days; release.yml is the long-term store.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR heads release runners; other events have unique run groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portable-tests:
    # The test suite on every supported OS/architecture pair. The binary
    # architecture check catches a runner that silently fell back to
    # emulation.
    name: Portable tests / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux amd64
            runner: ubuntu-24.04
            file-arch: x86-64
          - platform: Linux arm64
            runner: ubuntu-24.04-arm
            file-arch: aarch64
          - platform: Windows amd64
            runner: windows-2025
            pe-arch: x64
          - platform: Windows arm64
            runner: windows-11-arm
            pe-arch: ARM64
          - platform: macOS arm64
            runner: macos-15
            file-arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure
        run: >
          cmake -S . -B build-tests
          -DKISAK_BUILD_MP=OFF
          -DKISAK_BUILD_DEDICATED=OFF
          -DKISAK_BUILD_SP=OFF
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build portable tests
        run: cmake --build build-tests --config Release --parallel

      - name: Verify binary architecture (ELF/Mach-O)
        if: matrix.file-arch
        shell: bash
        run: >
          scripts/ci/verify-artifact-arch.sh '${{ matrix.file-arch }}'
          build-tests/tests/kisakcod-pool-allocator-tests
          build-tests/tests/kisakcod-db-zone-runtime-table-tests

      - name: Verify binary architecture (PE machine type)
        if: matrix.pe-arch
        shell: pwsh
        run: >
          ./scripts/ci/verify-artifact-arch.ps1 -Expected '${{ matrix.pe-arch }}'
          build-tests/tests/Release/kisakcod-pool-allocator-tests.exe
          build-tests/tests/Release/kisakcod-db-zone-runtime-table-tests.exe

      - name: Run portable tests
        run: ctest --test-dir build-tests -C Release --output-on-failure --parallel 4

  script-sanitizers:
    name: Script production paths / ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure script sanitizer contracts
        run: >
          cmake -S . -B build-script-sanitizers
          -DKISAK_BUILD_MP=OFF -DKISAK_BUILD_DEDICATED=OFF -DKISAK_BUILD_SP=OFF
          -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fPIE -DKISAK_REQUIRE_HIGH_POINTERS=1"
          -DCMAKE_EXE_LINKER_FLAGS="-pie" -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - name: Build script production contracts
        run: >
          cmake --build build-script-sanitizers --parallel 4 --target
          kisakcod-script-runtime-pointer-tests
          kisakcod-script-animation-fixup-tests
          kisakcod-script-save-registration-tests
          kisakcod-script-debugger-pointer-tests
          kisakcod-script-widening-value-tests
          kisakcod-script-readstack-nested-tests
          kisakcod-script-parser-stack-growth-tests
          kisakcod-net-chan-reassembly-tests
      - name: Run script production contracts
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: >
          ctest --test-dir build-script-sanitizers --output-on-failure --no-tests=error --parallel 4
          -R '^script-(runtime-pointer|animation-fixup|save-registration|debugger-pointer|widening-value|readstack-nested|parser-stack-growth)-contracts$|^net-chan-reassembly-span-contracts$'

  portable-sanitizers:
    # Required hosted ASan+UBSan execution over the portable profile (#134).
    # Both language frontends are instrumented because the suite links C
    # production subjects (the vendored zlib translation units in the memfile
    # test subject) alongside C++ production-body fixtures; instrumenting only
    # C++ would overstate the coverage. The per-test timeout is the bounded
    # budget that keeps a single hung subject from occupying the runner.
    name: Portable tests / ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure portable sanitizer contracts
        run: >
          cmake -S . -B build-portable-sanitizers
          -DKISAK_PLATFORM=linux
          -DKISAK_BUILD_MP=OFF -DKISAK_BUILD_DEDICATED=OFF -DKISAK_BUILD_SP=OFF
          -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build portable sanitizer contracts
        run: cmake --build build-portable-sanitizers --parallel

      - name: Run portable sanitizer contracts
        run: >
          ctest --test-dir build-portable-sanitizers --output-on-failure
          --no-tests=error --timeout 300 --parallel 4

  capability-dashboard:
    # Renders the KPI table (docs/NOW.md) and the target x role delivery
    # cells (docs/capability/manifest.json) into the run summary, and holds
    # the doc set to its ADR-0006 budgets.
    name: KPI summary and docs budget
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check doc-set budgets
        run: python3 scripts/ci/docs_budget.py

      - name: Render KPI summary
        run: python3 scripts/ci/kpi_summary.py >> "$GITHUB_STEP_SUMMARY"

  native64-census:
    # KPIs K1, K2, K3 and K5 (docs/design/NATIVE64.md, PLATFORM_POSIX.md):
    # clang syntax-only compiles of the headless server for win32 (control),
    # win64, lin64 and a64, a Win64 link attempt plus a labelled probe link,
    # and the upstream engine TUs the Linux test build compiles.
    # Informational only: it never gates and is not in scaffolding-complete.
    name: Native64 census
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # K3 lists src/ at the upstream merge-base (docs/UPSTREAM.md).
          fetch-depth: 0
          filter: blob:none

      - name: Install clang, lld and cross headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            clang lld mingw-w64 g++-aarch64-linux-gnu

      - name: Run census
        run: python3 scripts/ci/native64_census.py --out build-census --jobs 4

      - name: Publish KPI summary
        if: always()
        run: |
          if [ -f build-census/census.md ]; then
            cat build-census/census.md >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 scripts/ci/kpi_summary.py --census build-census/census.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native64-census
          path: build-census/census.json
          if-no-files-found: warn
          retention-days: 30

  windows-x86:
    name: Windows x86 / ${{ matrix.config }}
    runs-on: windows-2022
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
      DXSDK_VERSION: 9.29.952.8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.x

      - name: Restore DirectX SDK
        shell: pwsh
        run: |
          dotnet new classlib -o dxsdk-temp
          dotnet add dxsdk-temp package Microsoft.DXSDK.D3DX --version $env:DXSDK_VERSION
          $native = Join-Path $env:NUGET_PACKAGES "microsoft.dxsdk.d3dx\$env:DXSDK_VERSION\build\native"
          "DXSDK_NATIVE=$native" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B "build-${{ matrix.config }}" `
            -G "Visual Studio 17 2022" -A Win32 `
            -DCICD=ON "-DDXSDK_DIR=$env:DXSDK_NATIVE" `
            -DKISAK_BUILD_MP=ON `
            -DKISAK_BUILD_DEDICATED=ON `
            -DKISAK_BUILD_SP=OFF `
            -DKISAK_MEASURE_FX_ARCHIVE_STACK=ON

      - name: Build
        shell: pwsh
        run: >
          cmake --build "build-${{ matrix.config }}"
          --config "${{ matrix.config }}"
          --target KisakCOD-mp KisakCOD-dedi kisakcod-ilp32-tests
          --parallel

      - name: Enforce FX archive stack budgets
        shell: pwsh
        run: >
          ./scripts/ci/check-fx-archive-stack.ps1
          -InputPath
          "build-${{ matrix.config }}/scripts/mp/fx_archive_stack_${{ matrix.config }}.xml"

      - name: Run ILP32 tests
        shell: pwsh
        run: >
          ctest --test-dir "build-${{ matrix.config }}"
          -C "${{ matrix.config }}" --output-on-failure --no-tests=error
          -L ilp32 --parallel 4

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KisakCOD-windows-x86-${{ matrix.config }}
          # Miles comes from the user's own retail install; never ship it.
          path: |
            bin/${{ matrix.config }}/
            !bin/${{ matrix.config }}/mss32.dll
            !bin/${{ matrix.config }}/miles/
          if-no-files-found: error
          retention-days: 14

  windows-x86-sp:
    name: Windows x86 SP / ${{ matrix.config }}
    runs-on: windows-2022
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\\.nuget\\packages
      DXSDK_VERSION: 9.29.952.8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.x

      - name: Restore DirectX SDK
        shell: pwsh
        run: |
          dotnet new classlib -o dxsdk-temp
          dotnet add dxsdk-temp package Microsoft.DXSDK.D3DX --version $env:DXSDK_VERSION
          $native = Join-Path $env:NUGET_PACKAGES "microsoft.dxsdk.d3dx\\$env:DXSDK_VERSION\\build\\native"
          "DXSDK_NATIVE=$native" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset windows-x86-sp `
            -DCICD=ON "-DDXSDK_DIR=$env:DXSDK_NATIVE"

      - name: Build
        shell: pwsh
        run: cmake --build build-windows-x86-sp --config "${{ matrix.config }}" --target KisakCOD-sp --parallel

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KisakCOD-windows-x86-sp-${{ matrix.config }}
          path: bin/${{ matrix.config }}/KisakCOD-sp.exe
          if-no-files-found: error
          retention-days: 14

  windows-x86-headless:
    # This is the first real compile/link gate for the portable dedicated-server
    # source profile. Keep it independent of the legacy Windows client/media
    # build so headless cannot silently regain DirectX, Miles, Bink, or Steam.
    name: Windows x86 (headless dedicated)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-headless `
            -G "Visual Studio 17 2022" -A Win32 `
            -DKISAK_BUILD_MP=OFF `
            -DKISAK_BUILD_DEDICATED=ON `
            -DKISAK_BUILD_SP=OFF `
            -DKISAK_DEDI_HEADLESS=ON `
            -DKISAK_ENABLE_STEAM=OFF `
            -DKISAK_ENABLE_X86_MMX_SKINNING=OFF `
            -DBUILD_TESTING=OFF

      - name: Build
        shell: pwsh
        run: >
          cmake --build build-headless
          --config Release
          --target KisakCOD-dedi
          --parallel

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KisakCOD-windows-x86-headless-Release
          path: bin/Release/KisakCOD-dedi.exe
          if-no-files-found: error
          retention-days: 14

  scaffolding-complete:
    # The aggregate gate: every gating job must succeed. The census is
    # informational and deliberately absent.
    name: Portable scaffolding complete
    needs:
      - portable-tests
      - script-sanitizers
      - portable-sanitizers
      - capability-dashboard
      - windows-x86
      - windows-x86-sp
      - windows-x86-headless
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce required job results
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "required results: $results"
          fail=0
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "required job result: $r" >&2
              fail=1
            fi
          done
          exit $fail
