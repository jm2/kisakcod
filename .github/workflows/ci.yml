# CI gate for KisakCOD (docs/ROADMAP.md, WS-7).
#
#   - every job has a bounded timeout; superseded PR runs cancel
#   - every action is pinned to an immutable commit SHA (tag in comment)
#   - no checkout keeps persisted credentials; contents: read is the only
#     workflow permission
#   - scaffolding-complete aggregates the gating jobs; the native64-census
#     jobs are informational (KPIs K1-K3, K5) and never gate
#   - the Windows x86 byte-parity and no-Steam builds run nightly
#     (nightly.yml), not per push
#
# The engine targets are Win32-x86-only until gate G1: CMakeLists.txt fails
# a non-win32 or 64-bit engine configure unless KISAK_ALLOW_UNSUPPORTED_64BIT
# is set. The portable legs build and run the test suite only.
#
# CI artifacts live 14 days; release.yml is the long-term store.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR heads release runners. Pushes group by branch without cancelling a running run:
# at most one master run runs and one (the newest merge) waits; older pending runs are dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portable-tests:
    # The test suite on every supported OS/architecture pair. The binary
    # architecture check catches a runner that silently fell back to
    # emulation.
    name: Portable tests / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux amd64
            runner: ubuntu-24.04
            file-arch: x86-64
          - platform: Linux arm64
            runner: ubuntu-24.04-arm
            file-arch: aarch64
          - platform: Windows amd64
            runner: windows-2025
            pe-arch: x64
          - platform: Windows arm64
            runner: windows-11-arm
            pe-arch: ARM64
          - platform: macOS arm64
            # macos-26 is GitHub's newest GA macOS image (Apple clang 21,
            # macOS 26.5 SDK). The macOS 27 SDK is covered by the mac64
            # census on the xcode-27 preview image.
            runner: macos-26
            file-arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure
        run: >
          cmake -S . -B build-tests
          -DKISAK_BUILD_MP=OFF
          -DKISAK_BUILD_DEDICATED=OFF
          -DKISAK_BUILD_SP=OFF
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build portable tests
        # A bare --parallel is an unbounded make -j with the Makefiles
        # generator; on the 7 GB macOS runner that swaps for over an hour.
        run: cmake --build build-tests --config Release --parallel 4

      - name: Verify binary architecture (ELF/Mach-O)
        if: matrix.file-arch
        shell: bash
        run: >
          scripts/ci/verify-artifact-arch.sh '${{ matrix.file-arch }}'
          build-tests/tests/kisakcod-pool-allocator-tests
          build-tests/tests/kisakcod-db-zone-runtime-table-tests

      - name: Verify binary architecture (PE machine type)
        if: matrix.pe-arch
        shell: pwsh
        run: >
          ./scripts/ci/verify-artifact-arch.ps1 -Expected '${{ matrix.pe-arch }}'
          build-tests/tests/Release/kisakcod-pool-allocator-tests.exe
          build-tests/tests/Release/kisakcod-db-zone-runtime-table-tests.exe

      - name: Run portable tests
        run: ctest --test-dir build-tests -C Release --output-on-failure --parallel 4

      # Only root can plant a link owned by another user, so the filesystem
      # contracts run once more as root to reach the planted-link stage
      # (tests/platform_filesystem_tests.cpp); -V shows its RAN line.
      - name: Run filesystem contracts as root (planted links)
        if: matrix.platform == 'Linux amd64'
        run: >
          sudo --preserve-env=PATH "$(command -v ctest)" --test-dir build-tests -C Release
          -R platform-filesystem-path-contracts -V --output-on-failure

  script-sanitizers:
    name: Script production paths / ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure script sanitizer contracts
        run: >
          cmake -S . -B build-script-sanitizers
          -DKISAK_BUILD_MP=OFF -DKISAK_BUILD_DEDICATED=OFF -DKISAK_BUILD_SP=OFF
          -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fPIE -DKISAK_REQUIRE_HIGH_POINTERS=1"
          -DCMAKE_EXE_LINKER_FLAGS="-pie" -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - name: Build script production contracts
        run: >
          cmake --build build-script-sanitizers --parallel 4 --target
          kisakcod-script-runtime-pointer-tests
          kisakcod-script-animation-fixup-tests
          kisakcod-script-save-registration-tests
          kisakcod-script-debugger-pointer-tests
          kisakcod-script-widening-value-tests
          kisakcod-script-readstack-nested-tests
          kisakcod-script-parser-stack-growth-tests
          kisakcod-net-chan-reassembly-tests
      - name: Run script production contracts
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: >
          ctest --test-dir build-script-sanitizers --output-on-failure --no-tests=error --parallel 4
          -R '^script-(runtime-pointer|animation-fixup|save-registration|debugger-pointer|widening-value|readstack-nested|parser-stack-growth)-contracts$|^net-chan-reassembly-span-contracts$'

  portable-sanitizers:
    # Required hosted ASan+UBSan execution over the portable profile (#134).
    # Both language frontends are instrumented because the suite links C
    # production subjects (the vendored zlib translation units in the memfile
    # test subject) alongside C++ production-body fixtures; instrumenting only
    # C++ would overstate the coverage. The per-test timeout is the bounded
    # budget that keeps a single hung subject from occupying the runner.
    name: Portable tests / ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure portable sanitizer contracts
        run: >
          cmake -S . -B build-portable-sanitizers
          -DKISAK_PLATFORM=linux
          -DKISAK_BUILD_MP=OFF -DKISAK_BUILD_DEDICATED=OFF -DKISAK_BUILD_SP=OFF
          -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build portable sanitizer contracts
        run: cmake --build build-portable-sanitizers --parallel

      - name: Run portable sanitizer contracts
        run: >
          ctest --test-dir build-portable-sanitizers --output-on-failure
          --no-tests=error --timeout 300 --parallel 4

  capability-dashboard:
    # Renders the KPI table (docs/NOW.md) and the target x role delivery
    # cells (docs/capability/manifest.json) into the run summary, and holds
    # the doc set to its ADR-0006 budgets.
    name: KPI summary and docs budget
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check doc-set budgets
        run: python3 scripts/ci/docs_budget.py

      - name: Render KPI summary
        run: python3 scripts/ci/kpi_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Test the release script (manifest to release matrix)
        run: python3 scripts/ci/release_meta_test.py

  census-scope:
    # Decides which measure-only census jobs a pull request needs, to save
    # runner slots (GitHub Free: 20 concurrent jobs, 5 of them macOS).
    # Master pushes and manual runs always run both. A PR runs the Linux
    # census when it changes engine, test or build inputs, and the mac64 one
    # only when it changes the census tool itself (its script, TU-list generator,
    # stubs or pinned extern deps): the gating macOS headless job already
    # compiles every headless TU on each PR.
    name: Census scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      linux: ${{ steps.scope.outputs.linux }}
      mac64: ${{ steps.scope.outputs.mac64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Classify changed files
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            printf 'linux=true\nmac64=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: names only, so the blobless clone never fetches contents.
          # If the diff fails anyway, measure everything rather than skip.
          if ! files="$(git diff --no-renames --name-only "$BASE"...HEAD)"; then
            echo "::warning::could not list the changed files; running both censuses"
            printf 'linux=true\nmac64=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tool='^(scripts/ci/native64_census\.py|scripts/ci/native64-tulist\.cmake|scripts/ci/ci-stubs/|scripts/extern/)'
          inputs='^(src/|deps/|tests/|cmake/|scripts/.*\.cmake$|scripts/.*/CMakeLists\.txt$|CMakeLists\.txt$|CMakePresets\.json$|\.github/workflows/ci\.yml$)'
          linux=false; mac64=false
          if grep -qE "$tool" <<<"$files"; then linux=true; mac64=true; fi
          if grep -qE "$inputs" <<<"$files"; then linux=true; fi
          printf 'linux=%s\nmac64=%s\n' "$linux" "$mac64" | tee -a "$GITHUB_OUTPUT"

  native64-census:
    # KPIs K1, K2, K3 and K5 (docs/design/NATIVE64.md, PLATFORM_POSIX.md):
    # clang syntax-only compiles of the headless server for win32 (control),
    # win64, winarm64, lin64 and a64, a Win64 link attempt plus a labelled
    # probe link, and the upstream engine TUs the Linux test build compiles.
    # winarm64's headers come from an llvm-mingw release the script pins by
    # sha256. Informational only: it never gates and is not in
    # scaffolding-complete.
    name: Native64 census
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    needs: census-scope
    if: needs.census-scope.outputs.linux == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # K3 lists src/ at the upstream merge-base (docs/UPSTREAM.md).
          fetch-depth: 0
          filter: blob:none

      - name: Install clang, lld and cross headers
        # apt usually takes under a minute here but has stalled until the job
        # timeout; bound each attempt and retry instead.
        run: |
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120)
          for attempt in 1 2 3; do
            if sudo timeout -k 30 120 apt-get "${apt_opts[@]}" update -qq \
              && sudo timeout -k 30 240 apt-get "${apt_opts[@]}" install -y -qq --no-install-recommends \
                clang lld mingw-w64 g++-aarch64-linux-gnu; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or stalled"
          done
          exit 1

      - name: Run census
        run: python3 scripts/ci/native64_census.py --out build-census --jobs 4

      - name: Publish KPI summary
        if: always()
        run: |
          if [ -f build-census/census.md ]; then
            cat build-census/census.md >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 scripts/ci/kpi_summary.py --census build-census/census.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native64-census
          path: build-census/census.json
          if-no-files-found: warn
          retention-days: 30

  native64-census-mac64:
    # K1's macOS arm64 leg: the headless set syntax-checked with Apple clang
    # and the macOS SDK, which needs a macOS host. Informational only, like
    # native64-census: it never gates and is not in scaffolding-complete.
    # It runs on xcode-27 (macOS 27, Xcode 27), the macOS target, which is
    # still a preview image, so the gating macOS jobs use GA macos-26.
    name: Native64 census / mac64
    runs-on: xcode-27
    timeout-minutes: 20
    continue-on-error: true
    needs: census-scope
    if: needs.census-scope.outputs.mac64 == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Show compiler and SDK
        run: clang --version && xcrun --show-sdk-version

      - name: Run census
        run: python3 scripts/ci/native64_census.py --out build-census --targets mac64 --no-link --no-k3

      - name: Publish KPI summary
        if: always()
        run: |
          if [ -f build-census/census.md ]; then
            cat build-census/census.md >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 scripts/ci/kpi_summary.py --census build-census/census.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native64-census-mac64
          path: build-census/census.json
          if-no-files-found: warn
          retention-days: 30

  macos-headless:
    # The POSIX headless dedicated server on macOS arm64 (gate G3): the same
    # configure, architecture check and assetless smoke run as linux-headless.
    # It gates, so it runs on macos-26, GitHub's newest GA macOS image; the
    # mac64 census covers the macOS 27 SDK on xcode-27. Ninja bounds the bare
    # --parallel to the runner's cores.
    name: macOS headless server / arm64
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Show compiler and SDK
        run: clang --version && xcrun --show-sdk-version

      - name: Configure
        run: >
          cmake -S . -B build-headless -G Ninja
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DKISAK_BUILD_MP=OFF -DKISAK_BUILD_DEDICATED=ON -DKISAK_BUILD_SP=OFF
          -DKISAK_DEDI_HEADLESS=ON -DKISAK_ENABLE_STEAM=OFF
          -DKISAK_ALLOW_UNSUPPORTED_64BIT=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build KisakCOD-dedi
        run: cmake --build build-headless --target KisakCOD-dedi --parallel

      - name: Verify binary architecture
        run: scripts/ci/verify-artifact-arch.sh arm64 bin/KisakCOD-dedi

      - name: Assetless smoke run
        # The POSIX filesystem service follows no symlink in a path, and the
        # default macOS TMPDIR lies under the /var symlink, so the smoke's
        # fs_basepath and fs_homepath go in a symlink-free directory.
        run: |
          TMPDIR="$(cd "$RUNNER_TEMP" && pwd -P)" \
            python3 scripts/ci/headless_smoke.py bin/KisakCOD-dedi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KisakCOD-macos-arm64-headless
          path: bin/KisakCOD-dedi
          if-no-files-found: error
          retention-days: 14

  linux-headless:
    # The POSIX headless dedicated server (NOW row 13) on Linux amd64 and
    # arm64: the bead's done-test configure, an assetless smoke run against
    # synthetic stand-ins (retail data never reaches CI), and the binary as a
    # per-push artifact. Keep the rendered names: "Linux headless server /
    # amd64" is a required status check.
    name: Linux headless server / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            file-arch: x86-64
          - arch: arm64
            runner: ubuntu-24.04-arm
            file-arch: aarch64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install clang, lld and Ninja
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang lld ninja-build

      - name: Configure
        run: >
          cmake -S . -B build-headless -G Ninja
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DKISAK_BUILD_MP=OFF -DKISAK_BUILD_DEDICATED=ON -DKISAK_BUILD_SP=OFF
          -DKISAK_DEDI_HEADLESS=ON -DKISAK_ENABLE_STEAM=OFF
          -DKISAK_ALLOW_UNSUPPORTED_64BIT=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build KisakCOD-dedi
        run: cmake --build build-headless --target KisakCOD-dedi --parallel

      - name: Verify binary architecture
        run: scripts/ci/verify-artifact-arch.sh '${{ matrix.file-arch }}' bin/KisakCOD-dedi

      - name: Assetless smoke run
        run: python3 scripts/ci/headless_smoke.py bin/KisakCOD-dedi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KisakCOD-linux-${{ matrix.arch }}-headless
          path: bin/KisakCOD-dedi
          if-no-files-found: error
          retention-days: 14

  windows-headless:
    # The Win64 headless dedicated server (gate G1) built with MSVC: the
    # windows-amd64-dedi preset's cache variables on the runner's own Visual
    # Studio (the preset names VS 2022, which windows-2025 lacks), the same
    # assetless smoke run as linux-headless, and the binary with its PDB as a
    # per-push artifact. The arm64 leg (G3 prep) builds natively for ARM64 on
    # the hosted Windows ARM runner with the same cache variables.
    name: Windows headless server / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2025
            platform: x64
            pe-arch: x64
          - arch: arm64
            runner: windows-11-arm
            platform: ARM64
            pe-arch: ARM64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure
        run: >
          cmake -S . -B build-headless -A ${{ matrix.platform }}
          -DKISAK_BUILD_MP=OFF -DKISAK_BUILD_DEDICATED=ON -DKISAK_BUILD_SP=OFF
          -DKISAK_DEDI_HEADLESS=ON -DKISAK_ENABLE_STEAM=OFF
          -DKISAK_ENABLE_X86_MMX_SKINNING=OFF -DKISAK_ALLOW_UNSUPPORTED_64BIT=ON
          -DBUILD_TESTING=OFF

      - name: Build KisakCOD-dedi
        run: cmake --build build-headless --config Release --target KisakCOD-dedi --parallel

      - name: Verify binary architecture
        shell: pwsh
        run: ./scripts/ci/verify-artifact-arch.ps1 -Expected '${{ matrix.pe-arch }}' bin/Release/KisakCOD-dedi.exe

      - name: Assetless smoke run
        run: python scripts/ci/headless_smoke.py bin/Release/KisakCOD-dedi.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KisakCOD-windows-${{ matrix.arch }}-headless
          path: |
            bin/Release/KisakCOD-dedi.exe
            bin/Release/KisakCOD-dedi.pdb
          if-no-files-found: error
          retention-days: 14

  windows-x86:
    name: Windows x86 / ${{ matrix.config }}
    runs-on: windows-2022
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
      DXSDK_VERSION: 9.29.952.8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.x

      - name: Restore DirectX SDK
        shell: pwsh
        run: |
          dotnet new classlib -o dxsdk-temp
          dotnet add dxsdk-temp package Microsoft.DXSDK.D3DX --version $env:DXSDK_VERSION
          $native = Join-Path $env:NUGET_PACKAGES "microsoft.dxsdk.d3dx\$env:DXSDK_VERSION\build\native"
          "DXSDK_NATIVE=$native" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B "build-${{ matrix.config }}" `
            -G "Visual Studio 17 2022" -A Win32 `
            -DCICD=ON "-DDXSDK_DIR=$env:DXSDK_NATIVE" `
            -DKISAK_BUILD_MP=ON `
            -DKISAK_BUILD_DEDICATED=ON `
            -DKISAK_BUILD_SP=OFF `
            -DKISAK_MEASURE_FX_ARCHIVE_STACK=ON

      - name: Build
        shell: pwsh
        run: >
          cmake --build "build-${{ matrix.config }}"
          --config "${{ matrix.config }}"
          --target KisakCOD-mp KisakCOD-dedi kisakcod-ilp32-tests
          --parallel

      - name: Enforce FX archive stack budgets
        shell: pwsh
        run: >
          ./scripts/ci/check-fx-archive-stack.ps1
          -InputPath
          "build-${{ matrix.config }}/scripts/mp/fx_archive_stack_${{ matrix.config }}.xml"

      - name: Run ILP32 tests
        shell: pwsh
        run: >
          ctest --test-dir "build-${{ matrix.config }}"
          -C "${{ matrix.config }}" --output-on-failure --no-tests=error
          -L ilp32 --parallel 4

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KisakCOD-windows-x86-${{ matrix.config }}
          # Miles comes from the user's own retail install; never ship it.
          path: |
            bin/${{ matrix.config }}/
            !bin/${{ matrix.config }}/mss32.dll
            !bin/${{ matrix.config }}/miles/
          if-no-files-found: error
          retention-days: 14

  windows-x86-sp:
    name: Windows x86 SP / ${{ matrix.config }}
    runs-on: windows-2022
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\\.nuget\\packages
      DXSDK_VERSION: 9.29.952.8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.x

      - name: Restore DirectX SDK
        shell: pwsh
        run: |
          dotnet new classlib -o dxsdk-temp
          dotnet add dxsdk-temp package Microsoft.DXSDK.D3DX --version $env:DXSDK_VERSION
          $native = Join-Path $env:NUGET_PACKAGES "microsoft.dxsdk.d3dx\\$env:DXSDK_VERSION\\build\\native"
          "DXSDK_NATIVE=$native" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset windows-x86-sp `
            -DCICD=ON "-DDXSDK_DIR=$env:DXSDK_NATIVE"

      - name: Build
        shell: pwsh
        run: cmake --build build-windows-x86-sp --config "${{ matrix.config }}" --target KisakCOD-sp --parallel

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KisakCOD-windows-x86-sp-${{ matrix.config }}
          path: bin/${{ matrix.config }}/KisakCOD-sp.exe
          if-no-files-found: error
          retention-days: 14

  windows-x86-headless:
    # This is the first real compile/link gate for the portable dedicated-server
    # source profile. Keep it independent of the legacy Windows client/media
    # build so headless cannot silently regain DirectX, Miles, Bink, or Steam.
    name: Windows x86 (headless dedicated)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-headless `
            -G "Visual Studio 17 2022" -A Win32 `
            -DKISAK_BUILD_MP=OFF `
            -DKISAK_BUILD_DEDICATED=ON `
            -DKISAK_BUILD_SP=OFF `
            -DKISAK_DEDI_HEADLESS=ON `
            -DKISAK_ENABLE_STEAM=OFF `
            -DKISAK_ENABLE_X86_MMX_SKINNING=OFF `
            -DBUILD_TESTING=OFF

      - name: Build
        shell: pwsh
        run: >
          cmake --build build-headless
          --config Release
          --target KisakCOD-dedi
          --parallel

      - name: Verify binary architecture
        shell: pwsh
        run: ./scripts/ci/verify-artifact-arch.ps1 -Expected x86 bin/Release/KisakCOD-dedi.exe

      - name: Assetless smoke run
        run: python scripts/ci/headless_smoke.py bin/Release/KisakCOD-dedi.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KisakCOD-windows-x86-headless-Release
          path: bin/Release/KisakCOD-dedi.exe
          if-no-files-found: error
          retention-days: 14

  scaffolding-complete:
    # The aggregate gate: every gating job must succeed. The census jobs
    # are informational and deliberately absent.
    name: Portable scaffolding complete
    needs:
      - portable-tests
      - script-sanitizers
      - portable-sanitizers
      - capability-dashboard
      - windows-x86
      - windows-x86-sp
      - windows-x86-headless
      - linux-headless
      - macos-headless
      - windows-headless
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce required job results
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "required results: $results"
          fail=0
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "required job result: $r" >&2
              fail=1
            fi
          done
          exit $fail
