# CI gate for KisakCOD.
#
# Implements the multi-platform delivery contract from
# docs/CI_RELEASE_WORKFLOW_AUDIT.md (bead ki-8px) and docs/task.md Priority 8:
#   - every job has a bounded timeout (minutes are generous but finite)
#   - superseded runs cancel (concurrency + cancel-in-progress)
#   - every action is pinned to an immutable commit SHA (tag in comment)
#   - no checkout keeps persisted credentials; build jobs stay read-only
#     (contents: read is the only workflow permission)
#   - production-builds runs a production leg for every supported
#     OS/architecture pair and uploads a target-labeled artifact with an
#     explicit provenance manifest; production-complete is the required gate
#
# Retention policy: CI artifacts live 14 days (debugging window); the release
# workflow is the long-term store and pins 90 days there.
#
# Platform honesty note: the engine targets are Win32-x86-only today —
# CMakeLists.txt fails configuration for any non-win32 engine build and for
# 64-bit builds without the explicit KISAK_ALLOW_UNSUPPORTED_64BIT escape
# hatch, and that gate must not be relaxed (docs/task.md, Known release
# blockers). The windows-x86 production leg therefore builds and packages the
# real engine binaries, while the other five legs gate the portable production
# composition (the same required hosted legs the port has been merging
# against) with architecture truth, smoke tests, packaging, and provenance.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded runs on the same ref cancel instead of piling up.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-tests:
    # Utility/test composition for every supported OS/architecture pair. This
    # is the portable source-composition gate the port has required on every
    # change; it stays so the production-builds legs can evolve independently.
    name: Portable tests / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux amd64
            runner: ubuntu-24.04
          - platform: Linux arm64
            runner: ubuntu-24.04-arm
          - platform: Windows amd64
            runner: windows-2025
          - platform: Windows arm64
            runner: windows-11-arm
          - platform: macOS arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configure
        run: >
          cmake -S . -B build-tests
          -DKISAK_BUILD_MP=OFF
          -DKISAK_BUILD_DEDICATED=OFF
          -DKISAK_BUILD_SP=OFF
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build portable tests
        run: cmake --build build-tests --config Release --parallel

      - name: Run portable tests
        run: ctest --test-dir build-tests -C Release --output-on-failure

  # Sealed surface: source-invariant seal tests pin this job's exact step
  # shapes, names, and ordering, and normalize the file with comments left
  # in place — so do not reword step names, reorder steps, add comments
  # between the job key and its name, or reflow the artifact ref. Restored
  # verbatim from base; only timeout-minutes, persist-credentials: false,
  # and pinning the two actions no seal references were added. The
  # upload-artifact ref must stay literal until the seal markers are
  # updated (ki-yvj follow-up bead).
  windows-x86:
    name: Windows x86 / ${{ matrix.config }}
    runs-on: windows-2022
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
      DXSDK_VERSION: 9.29.952.8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.x

      - name: Restore DirectX SDK
        shell: pwsh
        run: |
          dotnet new classlib -o dxsdk-temp
          dotnet add dxsdk-temp package Microsoft.DXSDK.D3DX --version $env:DXSDK_VERSION
          $native = Join-Path $env:NUGET_PACKAGES "microsoft.dxsdk.d3dx\$env:DXSDK_VERSION\build\native"
          "DXSDK_NATIVE=$native" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B "build-${{ matrix.config }}" `
            -G "Visual Studio 17 2022" -A Win32 `
            -DCICD=ON "-DDXSDK_DIR=$env:DXSDK_NATIVE" `
            -DKISAK_BUILD_MP=ON `
            -DKISAK_BUILD_DEDICATED=ON `
            -DKISAK_BUILD_SP=OFF `
            -DKISAK_MEASURE_FX_ARCHIVE_STACK=ON

      - name: Build
        shell: pwsh
        run: >
          cmake --build "build-${{ matrix.config }}"
          --config "${{ matrix.config }}"
          --target KisakCOD-mp KisakCOD-dedi
          kisakcod-actor-grenade-prediction-cache-tests
          kisakcod-actor-grenade-safety-tests
          kisakcod-ui-safety-tests
          kisakcod-target-table-tests
          kisakcod-missile-layout-mp-compile-tests
          kisakcod-missile-layout-sp-compile-tests
          kisakcod-pool-allocator-tests
          kisakcod-physicalmemory-legacy-tests
          kisakcod-physicalmemory-runtime-tests
          kisakcod-physicalmemory-runtime-production-seal-tests
          kisakcod-physicalmemory-checked-tests
          kisakcod-physicalmemory-checked-api-seal-tests
          kisakcod-fx-effect-table-restore-tests
          kisakcod-fx-effect-table-save-tests
          kisakcod-fx-archive-disk32-tests
          kisakcod-fx-archive-body-state-disk32-tests
          kisakcod-fx-archive-system-disk32-tests
          kisakcod-fx-archive-buffers-disk32-tests
          kisakcod-fx-archive-native-disk32-tests
          kisakcod-fx-archive-reader-disk32-tests
          kisakcod-fx-archive-restore-candidate-disk32-tests
          kisakcod-fx-fastfile-disk32-tests
          kisakcod-fx-fastfile-native-disk32-tests
          kisakcod-fx-fastfile-impact-native-disk32-tests
          kisakcod-fx-fastfile-native-arena-tests
          kisakcod-fx-fastfile-zone-adapter-disk32-tests
          kisakcod-db-xasset-disk32-tests
          kisakcod-db-script-string-disk32-tests
          kisakcod-db-zone-load-context-tests
          kisakcod-db-zone-stream-ownership-tests
          kisakcod-db-zone-stream-ownership-production-seal-tests
          kisakcod-db-zone-pending-copy-ledger-tests
          kisakcod-db-zone-pending-copy-ledger-production-seal-tests
          kisakcod-db-script-string-journal-tests
          kisakcod-db-zone-script-string-ownership-tests
          kisakcod-db-registry-ownership-coordinator-tests
          kisakcod-db-registry-ownership-coordinator-production-seal-tests
          kisakcod-db-zone-runtime-facade-macro-off
          kisakcod-db-zone-runtime-facade-tests
          kisakcod-db-zone-runtime-facade-production-seal-tests
          kisakcod-db-zone-runtime-callback-context-macro-off
          kisakcod-db-zone-runtime-callback-context-tests
          kisakcod-db-zone-runtime-callback-context-production-seal-tests
          kisakcod-db-zone-runtime-table-tests
          kisakcod-db-zone-runtime-table-production-seal-tests
          kisakcod-db-zone-runtime-stable-context-integration-tests
          kisakcod-db-zone-runtime-storage-tests
          kisakcod-db-referenced-fastfile-tests
          kisakcod-server-file-compare-tests
          kisakcod-script-string-atomic-tests
          kisakcod-script-memorytree-lease-api-seal
          kisakcod-script-memorytree-try-tests
          kisakcod-script-string-ownership-tests
          kisakcod-platform-console-tests
          kisakcod-platform-service-runtime-tests
          kisakcod-renderer-value-encoding-tests
          kisakcod-upstream-sort-tests
          kisakcod-upstream-angle-math-tests
          kisakcod-upstream-aim-safety-tests
          kisakcod-upstream-command-dispatch-tests
          kisakcod-weapon-model-safety-tests
          kisakcod-weapon-input-safety-tests
          kisakcod-hudelem-sort-mp-tests
          kisakcod-hudelem-sort-sp-tests
          kisakcod-fx-physics-sidecar-production-seal-tests
          --parallel

      - name: Enforce FX archive stack budgets
        shell: pwsh
        run: >
          ./scripts/ci/check-fx-archive-stack.ps1
          -InputPath
          "build-${{ matrix.config }}/scripts/mp/fx_archive_stack_${{ matrix.config }}.xml"

      - name: Run portable transaction tests
        shell: pwsh
        run: >
          ctest --test-dir "build-${{ matrix.config }}"
          -C "${{ matrix.config }}" --output-on-failure
          -R "^(actor-grenade-prediction-cache-contracts|actor-grenade-safe-target-(radius-contracts|source-invariants)|ui-safety-runtime-contracts|ui-safety-source-invariants|target-table-(parse-and-layout-contracts|source-invariants)|target-client-source-invariants|missile-layout-(mp|sp)-compile-contracts|missile-union-layout-source-invariants|weapon-model-safety-(contracts|source-invariants)|weapon-input-safety-contracts|upstream-safe-fixlets-source-invariants|upstream-sort-(contracts|source-invariants)|upstream-reconciliation-(aim-safety-contracts|angle-math-contracts|command-dispatch-contracts|source-invariants)|upstream-820b0a03-core-source-invariants|upstream-last-four-source-invariants|hudelem-sort-((mp|sp)-contracts|source-invariants)|sound-dry-send-source-invariants|renderer-value-encoding-contracts|pool-native-pointer-freelist|universal-physicalmemory-legacy-(layout-and-indexing|source-invariants)|universal-physicalmemory-runtime-(control|production-test-access-sealed)|universal-physicalmemory-checked-(scopes|api-sealed|source-invariants)|database-xasset-disk32-envelope|database-script-string-disk32-walk|database-script-string-transaction-journal|database-script-string-ownership-source-invariants|database-zone-load-context-lifecycle|database-zone-stream-ownership-(runtime-contracts|production-test-access-sealed|source-invariants)|database-zone-pending-copy-(ledger|production-test-access-sealed|source-invariants)|database-zone-script-string-ownership-(controller|source-invariants)|database-registry-ownership-(coordinator|production-test-access-sealed|source-invariants)|database-zone-runtime-callback-context(-production-test-access-sealed|-macro-off-object-symbol-sealed|-source-invariants)?|database-zone-runtime-facade(-production-test-access-sealed|-source-invariants)?|database-zone-runtime-table-(ownership|stable-context-(legacy-descriptors|unused-busy|managed-key|bank-key|terminal-phase|claimed-neighbor|unused-neighbor)|source-invariants|production-test-access-sealed|unload-unsafe-[0-6]|unload-invalid-(missing-value|extra-value|unknown-option)|mutation-unsafe-(backend|postcondition)|mutation-invalid-(missing-value|extra-value|kind))|database-zone-runtime-stable-context-(integration|forgotten-finish)|database-zone-runtime-storage-(layout|source-invariants)|database-referenced-fastfile-format|qcommon-server-file-compare|script-string-packed-atomic-contracts|script-memorytree-try-contracts|script-string-report-free-ownership-contracts|platform-console-(runtime-contracts|invalid-eof-contracts|sigpipe-(default|ignore)-contracts|source-invariants)|platform-service-runtime-contracts|effectscore-physics-sidecar-production-test-access-sealed|effectscore-effect-table-(transactional-restore|bounded-save)|effectscore-archive-(disk32|system-disk32|buffers-disk32|native-disk32)-codec|effectscore-archive-body-state-disk32-codec|effectscore-archive-reader-disk32|effectscore-archive-restore-candidate-disk32|effectscore-fastfile-disk32-schema|effectscore-fastfile-(native|impact-native)-disk32-conversion|effectscore-fastfile-native-arena|effectscore-fastfile-zone-adapter-disk32)$"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KisakCOD-windows-x86-${{ matrix.config }}
          path: bin/${{ matrix.config }}/
          if-no-files-found: error
          retention-days: 14

  windows-x86-sp:
    name: Windows x86 SP / ${{ matrix.config }}
    runs-on: windows-2022
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\\.nuget\\packages
      DXSDK_VERSION: 9.29.952.8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.x

      - name: Restore DirectX SDK
        shell: pwsh
        run: |
          dotnet new classlib -o dxsdk-temp
          dotnet add dxsdk-temp package Microsoft.DXSDK.D3DX --version $env:DXSDK_VERSION
          $native = Join-Path $env:NUGET_PACKAGES "microsoft.dxsdk.d3dx\\$env:DXSDK_VERSION\\build\\native"
          "DXSDK_NATIVE=$native" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset windows-x86-sp `
            -DCICD=ON "-DDXSDK_DIR=$env:DXSDK_NATIVE"

      - name: Build
        shell: pwsh
        run: cmake --build build-windows-x86-sp --config "${{ matrix.config }}" --target KisakCOD-sp --parallel

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KisakCOD-windows-x86-sp-${{ matrix.config }}
          path: bin/${{ matrix.config }}/KisakCOD-sp.exe
          if-no-files-found: error
          retention-days: 14

  windows-x86-parity:
    # M0 exit gate: proves the shared retail reference bytes are byte-identical
    # across the Windows x86 MP/SP/dedicated baseline. Each preset is configured
    # with KISAK_REPRODUCIBLE_BUILD=ON so /Brepro pins the __DATE__/__TIME__ and
    # linker stamp inputs, and scripts/ci/compare-byte-parity.sh then hard-gates
    # buildnumber agreement and reference-object retail-section equality across
    # the three build trees (the CodeView .debug$* metadata that names each
    # target's object path, command line, and PDB is excluded by design).
    # Without the reproducible flag the wall-clock-stamped reference object
    # legitimately differs, so this job fails by design. The reference objects
    # are uploaded on every outcome so a mismatch can be diffed offline.
    name: Windows x86 (byte parity)
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
      DXSDK_VERSION: 9.29.952.8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.x

      - name: Restore DirectX SDK
        shell: pwsh
        run: |
          dotnet new classlib -o dxsdk-temp
          dotnet add dxsdk-temp package Microsoft.DXSDK.D3DX --version $env:DXSDK_VERSION
          $native = Join-Path $env:NUGET_PACKAGES "microsoft.dxsdk.d3dx\$env:DXSDK_VERSION\build\native"
          "DXSDK_NATIVE=$native" >> $env:GITHUB_ENV

      - name: Build MP / SP / dedicated baselines
        shell: pwsh
        run: |
          foreach ($preset in @('windows-x86-mp', 'windows-x86-sp', 'windows-x86-dedi')) {
            cmake --preset $preset -DKISAK_REPRODUCIBLE_BUILD=ON -DCICD=ON "-DDXSDK_DIR=$env:DXSDK_NATIVE"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          cmake --build build-windows-x86-mp --config Release --target KisakCOD-mp --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-windows-x86-sp --config Release --target KisakCOD-sp --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-windows-x86-dedi --config Release --target KisakCOD-dedi --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compare byte parity
        shell: bash
        run: scripts/ci/compare-byte-parity.sh build-windows-x86-mp build-windows-x86-sp build-windows-x86-dedi

      - name: Upload reference objects for parity diagnosis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KisakCOD-windows-x86-parity-objects
          path: |
            build-windows-x86-mp/**/buildnumber.obj
            build-windows-x86-sp/**/buildnumber.obj
            build-windows-x86-dedi/**/buildnumber.obj
          if-no-files-found: warn

  windows-x86-nosteam:
    # Compile-checks the KISAK_ENABLE_STEAM=OFF fallback path (cl_guid identity,
    # sv_requireSteam, empty win_steam.cpp TU). Windows x86 is the only target that can
    # build the engine today, so it stands in for the ARM/no-Steam configuration until
    # the POSIX/Vulkan platform layers land. Compile only; no artifact.
    name: Windows x86 (no Steam)
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
      DXSDK_VERSION: 9.29.952.8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.x

      - name: Restore DirectX SDK
        shell: pwsh
        run: |
          dotnet new classlib -o dxsdk-temp
          dotnet add dxsdk-temp package Microsoft.DXSDK.D3DX --version $env:DXSDK_VERSION
          $native = Join-Path $env:NUGET_PACKAGES "microsoft.dxsdk.d3dx\$env:DXSDK_VERSION\build\native"
          "DXSDK_NATIVE=$native" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-nosteam `
            -G "Visual Studio 17 2022" -A Win32 `
            -DCICD=ON "-DDXSDK_DIR=$env:DXSDK_NATIVE" `
            -DKISAK_BUILD_MP=ON `
            -DKISAK_BUILD_DEDICATED=ON `
            -DKISAK_BUILD_SP=OFF `
            -DKISAK_ENABLE_STEAM=OFF

      - name: Build
        shell: pwsh
        run: >
          cmake --build build-nosteam
          --config Release
          --target KisakCOD-mp KisakCOD-dedi
          --parallel

  windows-x86-headless:
    # This is the first real compile/link gate for the portable dedicated-server
    # source profile. Keep it independent of the legacy Windows client/media
    # build so headless cannot silently regain DirectX, Miles, Bink, or Steam.
    name: Windows x86 (headless dedicated)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-headless `
            -G "Visual Studio 17 2022" -A Win32 `
            -DKISAK_BUILD_MP=OFF `
            -DKISAK_BUILD_DEDICATED=ON `
            -DKISAK_BUILD_SP=OFF `
            -DKISAK_DEDI_HEADLESS=ON `
            -DKISAK_ENABLE_STEAM=OFF `
            -DKISAK_ENABLE_X86_MMX_SKINNING=OFF `
            -DBUILD_TESTING=OFF

      - name: Build
        shell: pwsh
        run: >
          cmake --build build-headless
          --config Release
          --target KisakCOD-dedi
          --parallel

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KisakCOD-windows-x86-headless-Release
          path: bin/Release/KisakCOD-dedi.exe
          if-no-files-found: error
          retention-days: 14

  production-builds:
    # Production leg for every supported OS/architecture pair. The windows-x86
    # leg builds and packages the real engine (MP + dedicated) through the same
    # shared script release.yml uses. The other five legs gate the portable
    # production composition for their target — the engine itself is
    # Win32-x86-only until the CMakeLists platform gate is lifted, so instead
    # of a matrix-only claim these legs assert architecture truth on the
    # binaries they built, run the full portable smoke suite, and publish a
    # target-labeled artifact with an explicit provenance manifest.
    name: Production / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86
            runner: windows-2022
            os: windows
          - target: windows-amd64
            runner: windows-2025
            os: windows
            cmake-arch: x64
            pe-arch: x64
          - target: windows-arm64
            runner: windows-11-arm
            os: windows
            cmake-arch: ARM64
            pe-arch: ARM64
          - target: linux-amd64
            runner: ubuntu-24.04
            os: linux
            file-arch: x86-64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            file-arch: aarch64
          - target: macos-arm64
            runner: macos-15
            os: macos
            file-arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # ---- windows-x86: the real engine production artifact ----
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        if: matrix.target == 'windows-x86'
        with:
          dotnet-version: 8.x

      - name: Build engine production binaries (shared profile)
        if: matrix.target == 'windows-x86'
        shell: pwsh
        run: ./scripts/ci/build-windows-x86.ps1 -BuildDir build-release -Config Release

      - name: Verify binary architecture (PE machine type)
        if: matrix.target == 'windows-x86'
        shell: pwsh
        run: >
          ./scripts/ci/verify-artifact-arch.ps1 -Expected x86
          bin/Release/KisakCOD-mp.exe bin/Release/KisakCOD-dedi.exe

      # Deep Windows x86 testing lives in the windows-x86 job (same shared
      # script, Debug + Release, full transaction-test allowlist); the
      # aggregator requires it, so this leg stays the release-parity
      # build+package gate instead of duplicating that suite.
      - name: Package production binaries
        if: matrix.target == 'windows-x86'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path bin/Release/* -DestinationPath dist/KisakCOD-windows-x86.zip
          [ordered]@{
            target        = "${{ matrix.target }}"
            commit        = $env:GITHUB_SHA
            ref           = $env:GITHUB_REF
            config        = "production-mp-dedi"
            workflow_run  = $env:GITHUB_RUN_ID
            generated_at  = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json | Set-Content -Encoding utf8 dist/KisakCOD-windows-x86-provenance.json

      # ---- portable production composition (all other targets) ----
      # Static `shell: bash` on every portable leg: expressions are not
      # permitted in `shell:` (actionlint / GitHub context-availability), the
      # commands are shell-agnostic, and Git Bash is preinstalled on the
      # Windows runners.
      - name: Configure portable production composition
        if: matrix.target != 'windows-x86'
        shell: bash
        run: >
          cmake -S . -B build-release
          ${{ matrix.cmake-arch && format('-A {0}', matrix.cmake-arch) || '' }}
          -DKISAK_BUILD_MP=OFF
          -DKISAK_BUILD_DEDICATED=OFF
          -DKISAK_BUILD_SP=OFF
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build portable production composition
        if: matrix.target != 'windows-x86'
        shell: bash
        run: cmake --build build-release --config Release --parallel

      - name: Verify binary architecture (ELF/Mach-O)
        if: matrix.os == 'linux' || matrix.os == 'macos'
        shell: bash
        run: >
          scripts/ci/verify-artifact-arch.sh '${{ matrix.file-arch }}'
          build-release/tests/kisakcod-pool-allocator-tests
          build-release/tests/kisakcod-db-zone-runtime-table-tests

      - name: Verify binary architecture (PE machine type)
        if: matrix.os == 'windows' && matrix.target != 'windows-x86'
        shell: pwsh
        run: >
          ./scripts/ci/verify-artifact-arch.ps1 -Expected '${{ matrix.pe-arch }}'
          build-release/tests/Release/kisakcod-pool-allocator-tests.exe
          build-release/tests/Release/kisakcod-db-zone-runtime-table-tests.exe

      - name: Run portable smoke suite
        if: matrix.target != 'windows-x86'
        shell: bash
        run: ctest --test-dir build-release -C Release --output-on-failure

      - name: Package portable composition
        if: matrix.os == 'linux' || matrix.os == 'macos'
        shell: bash
        run: |
          mkdir -p dist
          # Reproducible archives need GNU tar (--sort/--owner/--group).
          # macOS 15 runners alias bsdtar to `tar` and GNU tar to `gtar`;
          # Linux runners have GNU tar as `tar`.
          TAR="$(command -v gtar || command -v tar)"
          "$TAR" --sort=name --owner=0 --group=0 \
            -czf "dist/KisakCOD-${{ matrix.target }}-portable-Release.tar.gz" \
            -C build-release/tests .
          jq -n \
            --arg target '${{ matrix.target }}' \
            --arg commit "${GITHUB_SHA}" \
            --arg ref "${GITHUB_REF}" \
            --arg config "portable-production-composition" \
            --arg run "${GITHUB_RUN_ID}" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{target: $target, commit: $commit, ref: $ref, config: $config, workflow_run: $run, generated_at: $generated_at}' \
            > "dist/KisakCOD-${{ matrix.target }}-portable-Release-provenance.json"

      - name: Package portable composition
        if: matrix.os == 'windows' && matrix.target != 'windows-x86'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build-release/tests/Release/*.exe -DestinationPath "dist/KisakCOD-${{ matrix.target }}-portable-Release.zip"
          [ordered]@{
            target        = "${{ matrix.target }}"
            commit        = $env:GITHUB_SHA
            ref           = $env:GITHUB_REF
            config        = "portable-production-composition"
            workflow_run  = $env:GITHUB_RUN_ID
            generated_at  = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json | Set-Content -Encoding utf8 "dist/KisakCOD-${{ matrix.target }}-portable-Release-provenance.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KisakCOD-${{ matrix.target }}-Release
          path: dist/
          if-no-files-found: error
          retention-days: 14

  production-complete:
    # The required production gate: every build job in this workflow plus the
    # six production legs must succeed. Branch protection should require this
    # single job.
    name: Production complete
    needs:
      - portable-tests
      - windows-x86
      - windows-x86-sp
      - windows-x86-parity
      - windows-x86-nosteam
      - windows-x86-headless
      - production-builds
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce required job results
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "required results: $results"
          fail=0
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "required job result: $r" >&2
              fail=1
            fi
          done
          exit $fail
