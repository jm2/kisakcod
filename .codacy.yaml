---
# Codacy's C/C++ analysis treats .h headers as C because this repository
# mixes C and C++ translation units, and the C parsers cannot handle
# C++-only constructs (namespaces, typed enums `enum X : int32_t`,
# static_assert, <cstdint>, extern "C" blocks, __cdecl call-convention
# spellings), which they surface as false "invalid C code" annotations.
#
# src/game/taginfo_disk32.h is the C++-only tagInfo save-converter header;
# its ABI contracts are pinned at compile time by static_asserts and
# exercised byte-for-byte by tests/save_taginfo_tests.cpp.
#
# src/universal/msvc_printf_shim.h exists solely to host the two
# _vsnprintf/_snprintf truncation wrappers: their bodies call vsnprintf
# with a caller-supplied format string, which is the definition of a
# printf-family wrapper and unavoidably trips CWE-134-style "use a
# constant format" patterns. Nothing else will ever live in this file;
# the truncation contract is runtime-tested by
# tests/msvc_printf_shim_tests.cpp on every host.
#
# tests/xmodel_cursor_test_support.h is the C++-only shared fixture and
# CHECK-harness header for the two xmodel cursor contract suites
# (kisakcod-xmodel-nested-cursor-tests and
# kisakcod-xmodel-cursor-overflow-tests, compiled and run on every host
# incl. the hosted legs). It is header-only by design with
# namespace-scoped fixtures, so the C parser false-positives on the
# namespace definition itself; the header's contracts are exercised by
# both suites on every test run.
#
# The remaining headers carry C++-only constructs on lines touched by the
# platform port (ki-vuj). The same constructs are compile-checked by the
# production gate on every supported compiler (cmake --preset
# linux-amd64-mp / macos-arm64-mp, MSVC on the hosted Windows legs).
# deps/ode/*.h are vendored third-party (Open Dynamics Engine) sources.
#
# Excluding these paths from the C-parsed static analysis loses no signal.
exclude_paths:
  - "src/game/taginfo_disk32.h"
  - "src/universal/msvc_printf_shim.h"
  - "deps/ode/collision.h"
  - "deps/ode/objects.h"
  - "src/physics/ode/collision_trimesh_KISAK.h"
  - "src/physics/ode/util.h"
  - "src/qcommon/graph.h"
  - "tests/xmodel_cursor_test_support.h"
