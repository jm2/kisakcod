---
# Codacy's C/C++ analysis treats .h headers as C because this repository
# mixes C and C++ translation units. The header below is C++-only on every
# line (namespace-scoped inline constexpr configuration and a class
# interface; no C translation unit includes it), which the C parsers
# surface as a false "invalid C code" annotation and hold the PR gate
# ACTION_REQUIRED. The same constructs are compile-checked by the
# production gate on every supported compiler (cmake --preset
# linux-amd64-mp / macos-arm64-mp, MSVC on the hosted Windows legs), so
# excluding it from the C-parsed static analysis loses no signal.
exclude_paths:
  - "src/database/db_graph_hash.h"
